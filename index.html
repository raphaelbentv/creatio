    <script>
      /* Jumeau du script de public/404.html : GitHub Pages nous a renvoyé
         /?/services au lieu de /services, on remet l'URL d'origine dans la
         barre d'adresse AVANT que React Router ne lise l'emplacement.
         Les deux fichiers doivent rester synchrones. */
      (function (l) {
        if (l.search[1] === '/') {
          var route = l.search
            .slice(1)
            .split('&')
            .map(function (part) {
              return part.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + route + l.hash
          );
        }
      })(window.location);
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
